<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Radiance">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Radiance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            height: 100%;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
        }
        
        .palette {
            display: flex;
            flex-direction: column;
            min-height: calc(100vh - 120px);
        }
        
        .color-bar {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            position: relative;
        }
        
        .color-bar:active {
            opacity: 0.85;
        }
        
        .hex-code {
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .bar-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.6;
            position: absolute;
            right: 24px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .anchor .bar-label::after {
            content: ' ✎';
        }
        
        .copied-toast {
            position: fixed;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(0,0,0,0.85);
            color: #fff;
            padding: 14px 28px;
            border-radius: 30px;
            font-size: 16px;
            font-weight: 500;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 100;
        }
        
        .copied-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        
        .controls {
            background: #000;
            padding: 16px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            border-top: 1px solid #222;
        }
        
        .controls button {
            background: #222;
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s, opacity 0.2s;
        }
        
        .controls button:active {
            background: #444;
        }
        
        .controls button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        
        .color-count {
            color: #888;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            min-width: 80px;
            text-align: center;
        }
        
        .bottom-bar {
            background: #000;
            padding: 16px 24px;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }
        
        .all-codes {
            color: #888;
            font-size: 11px;
            font-family: 'SF Mono', Monaco, monospace;
            letter-spacing: 0.5px;
            user-select: all;
            -webkit-user-select: all;
            word-break: break-all;
            line-height: 1.6;
        }
        
        .color-input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            left: 0;
            top: 0;
        }
        
        .preset-btn {
            margin-left: auto;
        }
        
        .presets-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            border-radius: 20px 20px 0 0;
            padding: 20px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            transform: translateY(100%);
            transition: transform 0.3s ease;
            z-index: 200;
            max-height: 70vh;
            overflow-y: auto;
        }
        
        .presets-panel.open {
            transform: translateY(0);
        }
        
        .presets-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }
        
        .presets-header button {
            background: none;
            border: none;
            color: #888;
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
        }
        
        .preset-group {
            margin-bottom: 20px;
        }
        
        .preset-group-title {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        
        .preset-item {
            display: flex;
            align-items: center;
            padding: 12px;
            background: #1a1a1a;
            border-radius: 12px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        .preset-item:active {
            background: #2a2a2a;
        }
        
        .preset-swatches {
            display: flex;
            gap: 4px;
            flex: 1;
        }
        
        .preset-swatch {
            width: 28px;
            height: 28px;
            border-radius: 6px;
        }
        
        .preset-name {
            color: #888;
            font-size: 12px;
            margin-left: 12px;
            min-width: 80px;
            text-align: right;
        }

        .seg {
            display: flex;
            gap: 8px;
        }

        .seg button {
            flex: 1;
            background: #1a1a1a;
            color: #888;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px;
            font: inherit;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .seg button[aria-pressed="true"] {
            background: #2a2a2a;
            color: #fff;
            border-color: #555;
        }

        .seg-note {
            color: #666;
            font-size: 12px;
            line-height: 1.5;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="palette" id="palette"></div>
    
    <div class="controls">
        <button id="btn-remove">−</button>
        <span class="color-count" id="color-count">5 colors</span>
        <button id="btn-add">+</button>
        <button id="btn-presets" class="preset-btn">☰</button>
    </div>
    
    <div class="presets-panel" id="presets-panel">
        <div class="presets-header">
            <span>Presets</span>
            <button id="btn-close-presets">✕</button>
        </div>
        <div class="preset-group">
            <div class="preset-group-title">Bridges</div>
            <div class="seg" id="bridge-seg" role="group" aria-label="Bridge style">
                <button type="button" data-mode="blend">Blend</button>
                <button type="button" data-mode="wheel">Wheel</button>
            </div>
            <p class="seg-note" id="bridge-note"></p>
        </div>
        <div class="presets-list" id="presets-list"></div>
    </div>
    
    <div class="bottom-bar" id="bottom-bar">
        <span class="all-codes" id="all-codes"></span>
    </div>
    
    <div class="copied-toast" id="toast">Copied!</div>
    
    <script>
        // Register service worker -- but NEVER on localhost.
        //
        // The worker is cache-first on a fixed name, which is right for an
        // installed PWA and poisonous while developing: it caches a snapshot on
        // first load and serves it back on every reload afterwards, so the page
        // under test is always one edit behind the file on disk. Bumping
        // CACHE_NAME does not help, because the name does not change between
        // saves -- it is a release mechanism, not a development one.
        //
        // The failure mode is the expensive part: the app runs, nothing errors,
        // and the change simply is not there. That reads exactly like a broken
        // change, so the time goes into debugging code that was never executed.
        const IS_DEV = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);

        if ('serviceWorker' in navigator && !IS_DEV) {
            navigator.serviceWorker.register('sw.js');
        } else if (IS_DEV && 'serviceWorker' in navigator) {
            // Clean up after any worker registered before this guard existed,
            // otherwise it keeps serving its cache on this origin forever.
            navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
            if (window.caches) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
        }
        
        // State: anchors array (2-5 anchors = 3-9 total colors)
        let anchors = generateEvenHues(3);
        
        // Generate evenly spaced hues around 360°
        function generateEvenHues(count) {
            const hues = [];
            const step = 360 / count;
            for (let i = 0; i < count; i++) {
                const hue = Math.round(i * step);
                hues.push(hslToHex(hue, 100, 50));
            }
            return hues;
        }
        
        // HSL to Hex
        function hslToHex(h, s, l) {
            s /= 100;
            l /= 100;
            const a = s * Math.min(l, 1 - l);
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
        }
        
        // Parse hex to RGB
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }
        
        // RGB to hex
        function rgbToHex(r, g, b) {
            return '#' + [r, g, b].map(x => {
                const hex = Math.round(x).toString(16);
                return hex.length === 1 ? '0' + hex : hex;
            }).join('').toUpperCase();
        }
        
        // --- OKLab -------------------------------------------------------
        // A bridge is only a bridge if it LOOKS halfway between its anchors,
        // and HSL cannot promise that. HSL's "L" is not perceived lightness:
        // averaging green (#00FF00) and blue (#0000FF) in HSL gives cyan
        // (#00FFFF), which is LIGHTER than both colors it sits between. It
        // does not bridge, it spikes. Measured in perceptual lightness the
        // anchors are 0.866 and 0.452, so the midpoint should read 0.659 --
        // HSL puts it at 0.905, off by 0.246.
        //
        // OKLab is built so that equal numeric steps look like equal steps.
        // The same pair midpoints to #00AABF at 0.675, which is where the eye
        // expects it. Same idea for the anchors themselves: evenly spaced HSL
        // hues range over 0.41 in perceived lightness (red 0.628, green 0.866,
        // blue 0.452), which is why a "smooth" ramp never looked smooth.
        //
        // hslToHex stays, for the initial evenly-spaced anchors. HSL is a fine
        // thing to SPECIFY a starting color in. It is just not a thing to
        // average in, and nothing averages in it any more.

        function srgbToLinear(c) {
            c /= 255;
            return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        }

        function linearToSrgb(c) {
            const v = c <= 0.0031308 ? 12.92 * c : 1.055 * Math.pow(c, 1 / 2.4) - 0.055;
            return Math.max(0, Math.min(255, v * 255));
        }

        function hexToOklab(hex) {
            const rgb = hexToRgb(hex);
            const r = srgbToLinear(rgb.r), g = srgbToLinear(rgb.g), b = srgbToLinear(rgb.b);

            const l = 0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b;
            const m = 0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b;
            const s = 0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b;

            const l_ = Math.cbrt(l), m_ = Math.cbrt(m), s_ = Math.cbrt(s);

            return {
                L: 0.2104542553 * l_ + 0.7936177850 * m_ - 0.0040720468 * s_,
                a: 1.9779984951 * l_ - 2.4285922050 * m_ + 0.4505937099 * s_,
                b: 0.0259040371 * l_ + 0.7827717662 * m_ - 0.8086757660 * s_
            };
        }

        function oklabToLinear(lab) {
            const l_ = lab.L + 0.3963377774 * lab.a + 0.2158037573 * lab.b;
            const m_ = lab.L - 0.1055613458 * lab.a - 0.0638541728 * lab.b;
            const s_ = lab.L - 0.0894841775 * lab.a - 1.2914855480 * lab.b;

            const l = l_ * l_ * l_, m = m_ * m_ * m_, s = s_ * s_ * s_;

            return [
                +4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
                -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
                -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
            ];
        }

        // The tolerance is not slop, it is the accuracy of the transform. The
        // OKLab matrices are fitted approximations, so a colour that sits
        // exactly ON the sRGB hull round-trips to a channel a few ten-thousandths
        // the wrong side of zero.
        //
        // At 1e-4 that broke an assumption every bisection here depends on --
        // that the ray out from neutral is in gamut up to one boundary and out
        // after it. Measured along pure blue's ray (L 0.452, H 264.05): in gamut
        // at 85% of its chroma, OUT at 90%, 95% and 99% where linear red reads
        // -0.00063, and in again at 100% where it is exactly 0. A hole in the
        // middle, and a bisection walks straight into it -- maxChroma returned
        // 0.2674 for a colour whose chroma is 0.3132, a 15% underestimate, and
        // oklabToHex used the same pattern to desaturate bridges further than
        // the gamut actually required.
        //
        // 1e-3 clears the transform's own error. In linear light that is well
        // under a quarter of an 8-bit step, and the clamp at the end of
        // oklabToHex catches whatever rounds past the edge.
        const GAMUT_EPS = 1e-3;

        function inGamut(lab) {
            return oklabToLinear(lab).every(c => c >= -GAMUT_EPS && c <= 1 + GAMUT_EPS);
        }

        // OKLab is bigger than sRGB, so a midpoint can land somewhere the screen
        // cannot show. SOMETHING has to give, and the choice of what decides
        // whether the bridge still reads as a bridge.
        //
        // Clamping each channel at the end -- the obvious way, and what this did
        // -- gives away lightness and hue, the two properties the whole OKLab
        // change was made to protect. Measured over every bridge the presets
        // produce, 23 land outside sRGB and clamping moved them up to 3.6 deg in
        // hue and 0.014 in L. The green -> blue midpoint from the notes above
        // came out at L 0.676 against a target of 0.659; that residual was
        // blamed on "gamut clipping" and this is the clipping it meant.
        //
        // Reducing CHROMA instead gives away saturation, which is the one thing
        // a bridge does not promise. Same 23 colors: worst hue shift 0.9 deg,
        // worst L error 0.0009 -- fifteen times closer. Green -> blue now lands
        // at 0.659 exactly, so the residual is gone rather than explained.
        function oklabToHex(lab) {
            let out = lab;
            if (!inGamut(lab)) {
                let lo = 0, hi = 1;
                for (let i = 0; i < 24; i++) {
                    const mid = (lo + hi) / 2;
                    if (inGamut({ L: lab.L, a: lab.a * mid, b: lab.b * mid })) lo = mid;
                    else hi = mid;
                }
                out = { L: lab.L, a: lab.a * lo, b: lab.b * lo };
            }
            // Still clamp: chroma reduction cannot rescue an L outside [0,1],
            // and rounding leaves channels a hair over.
            return rgbToHex(...oklabToLinear(out).map(c => linearToSrgb(Math.max(0, Math.min(1, c)))));
        }

        // --- Bridge policy ----------------------------------------------
        // Both midpoints below are in OKLab and both are perceptually honest.
        // They differ in what they treat as the thing being halved.
        //
        // BLEND averages a and b as coordinates: the true midpoint of the two
        // colors as POINTS. a and b are signed, so as the anchors' hues diverge
        // the two vectors point apart and partly cancel -- gold and navy are
        // both strongly colored and their blend is #7E7D70, a drab olive grey.
        // Nothing is out of gamut there; the saturation was destroyed by the
        // arithmetic. Across the shipped presets, 12 bridges lose more than half
        // their anchors' chroma this way.
        //
        // WHEEL averages lightness and chroma as scalars and walks hue around
        // the shorter arc: the midpoint of the two HUES. Chroma at the bridge is
        // the mean of the two chromas by construction, so it cannot collapse and
        // cannot exceed the colors it sits between. Gold -> navy becomes #009083.
        //
        // Neither is a better version of the other, which is the test a setting
        // has to pass to deserve existing. Blend answers "what color is halfway
        // between these two", wheel answers "what color is halfway around from
        // one to the other". Blend stays the default because it is what every
        // saved palette was built with.
        //
        // NOT OFFERED: pushing chroma out to the gamut hull. It was measured and
        // it is a trap -- the headroom is largest exactly where hue means least.
        // Two pale neutrals whose midpoint chroma is 0.002 have 89x of it, and
        // spending it turns a soft grey into #C3FF3B. At C near zero the hue is
        // arbitrary, so amplifying it invents a color rather than finding one.
        let bridgeMode = 'blend';

        function midpointColor(hex1, hex2) {
            const c1 = hexToOklab(hex1);
            const c2 = hexToOklab(hex2);
            const L = (c1.L + c2.L) / 2;

            if (bridgeMode === 'blend') {
                return oklabToHex({ L, a: (c1.a + c2.a) / 2, b: (c1.b + c2.b) / 2 });
            }

            const k1 = Math.hypot(c1.a, c1.b), k2 = Math.hypot(c2.a, c2.b);
            let h1 = Math.atan2(c1.b, c1.a), h2 = Math.atan2(c2.b, c2.a);
            // A grey has no hue -- CSS Color 4 calls it powerless. atan2(0,0) is
            // 0, which is red, so averaging against it would drag every bridge
            // out of a neutral anchor toward pink. Borrow the other end's hue.
            if (k1 < 1e-6) h1 = h2;
            if (k2 < 1e-6) h2 = h1;
            const d = ((h2 - h1 + Math.PI) % (2 * Math.PI) + 2 * Math.PI) % (2 * Math.PI) - Math.PI;
            const h = h1 + d / 2, c = (k1 + k2) / 2;
            return oklabToHex({ L, a: c * Math.cos(h), b: c * Math.sin(h) });
        }

        // --- Ink on a bar -------------------------------------------------
        // This used to weight the GAMMA-ENCODED channels 0.299/0.587/0.114 and
        // switch at 0.5. Two things wrong with that, and they compound: the NTSC
        // weights are for analogue luma, not for contrast, and the channels have
        // to be linearised before any weighting means anything.
        //
        // The switch point is not a matter of taste either. White beats black
        // exactly while 1.05/(L+0.05) > (L+0.05)/0.05, so the crossover is
        // sqrt(0.0525) - 0.05 = 0.1791 -- nowhere near the midpoint, because
        // contrast is a ratio and black has the shorter run to the floor.
        //
        // Measured over the 114 colors in the preset library, the old test put
        // the wrong ink on 14 of them. The worst was #FF00FF, which got white at
        // 3.14:1 where black scores 6.70:1. Worst case anywhere goes 3.14 -> 4.72,
        // so every hex code on screen now clears AA at normal size.
        const INK_CROSSOVER = Math.sqrt(0.0525) - 0.05;

        function relativeLuminance(hex) {
            const rgb = hexToRgb(hex);
            return 0.2126 * srgbToLinear(rgb.r)
                 + 0.7152 * srgbToLinear(rgb.g)
                 + 0.0722 * srgbToLinear(rgb.b);
        }

        function inkOn(hex) {
            return relativeLuminance(hex) > INK_CROSSOVER ? '#000' : '#fff';
        }

        // --- Measurement ---------------------------------------------------
        // What a snap point is made of. Every function here returns a NUMBER,
        // never a verdict. The scrubber's job is to narrow the field and say
        // why; the eye still picks. That split is the whole design, and it is
        // also the honest one -- these metrics can tell you a palette is
        // legible and coherent, they cannot tell you it is beautiful.

        const DEG = 180 / Math.PI;

        function hexToOklch(hex) {
            const { L, a, b } = hexToOklab(hex);
            const C = Math.hypot(a, b);
            // A neutral has no hue -- CSS Color 4 calls it powerless. Reported
            // as null rather than as atan2(0, 0), which is red and would put a
            // grey into the harmony maths as though it pointed somewhere.
            const H = C < 1e-6 ? null : ((Math.atan2(b, a) * DEG) % 360 + 360) % 360;
            return { L, C, H };
        }

        function oklchToHex({ L, C, H }) {
            const h = (H === null ? 0 : H) / DEG;
            return oklabToHex({ L, a: C * Math.cos(h), b: C * Math.sin(h) });
        }

        // The most chroma sRGB can actually show at this lightness and hue.
        // The hull is nothing like a circle -- yellow reaches far further out
        // than blue -- so "hold chroma constant across these hues" is only a
        // request that can be granted up to the SMALLEST hull among them.
        function maxChroma(L, H) {
            if (H === null) return 0;
            const h = H / DEG, cos = Math.cos(h), sin = Math.sin(h);
            let lo = 0, hi = 0.4;
            for (let i = 0; i < 24; i++) {
                const mid = (lo + hi) / 2;
                if (inGamut({ L, a: mid * cos, b: mid * sin })) lo = mid; else hi = mid;
            }
            return lo;
        }

        function contrast(hex1, hex2) {
            const a = relativeLuminance(hex1), b = relativeLuminance(hex2);
            return (Math.max(a, b) + 0.05) / (Math.min(a, b) + 0.05);
        }

        // --- Harmony --------------------------------------------------------
        // The named harmonies are angular relationships, so the STRUCTURE ports
        // to OKLCH cleanly. The familiar NUMBERS do not: the artist's wheel is
        // RYB, the web's is HSL, and OKLCH hue is neither, so copying 120 across
        // from a colour-theory chart would be folklore rather than geometry.
        //
        // What is derivable: n colours spread evenly around the circle sit
        // 360/n apart. In OKLCH those steps are also equal TO THE EYE, which is
        // the entire reason for working in a uniform space -- the same division
        // in HSL gives a crowded band of blues and a gap through the yellows.
        // And 180 deg negates both a and b, so the complement here is the
        // opponent-axis opposite: principled, not traditional.
        //
        // Analogous is the one genuinely empirical entry. It is not a division
        // of anything, it is "near neighbours", and 30 deg is the conventional
        // reading of near.
        function canonicalSpacings(n) {
            const snaps = [
                { name: 'Monochromatic', spacing: 0 },
                { name: 'Analogous', spacing: 30 }
            ];
            if (n >= 2) snaps.push({ name: n === 2 ? 'Complementary' : `Even ${n}-way`, spacing: 360 / n });
            if (n > 2) snaps.push({ name: 'Complementary', spacing: 180 });
            // Two entries can collide -- at n = 12 the even split IS analogous.
            return snaps.filter((s, i) => snaps.findIndex(o => Math.abs(o.spacing - s.spacing) < 1) === i);
        }

        // Signed shortest arc, so a palette walking one way round the wheel
        // reads as consistent rather than as alternating +350/-10.
        function hueDelta(from, to) {
            return ((to - from + 180) % 360 + 360) % 360 - 180;
        }

        function classifyHarmony(hexes) {
            const hues = hexes.map(h => hexToOklch(h).H);
            if (hues.some(h => h === null)) {
                return { name: 'Contains a neutral', spacing: null, even: null, offBy: null };
            }
            const steps = [];
            for (let i = 1; i < hues.length; i++) steps.push(hueDelta(hues[i - 1], hues[i]));

            const mag = steps.map(Math.abs);
            const spacing = mag.reduce((a, b) => a + b, 0) / mag.length;
            // Even means the steps agree with each other, which is a separate
            // question from whether they land on a named angle. A palette can be
            // perfectly even at 47 deg and belong to no family at all.
            const even = Math.max(...mag.map(m => Math.abs(m - spacing)));

            let best = null;
            for (const snap of canonicalSpacings(hexes.length)) {
                const offBy = Math.abs(spacing - snap.spacing);
                if (!best || offBy < best.offBy) best = { ...snap, offBy };
            }
            return { name: best.name, spacing, even, offBy: best.offBy, target: best.spacing };
        }

        // --- The whole picture ----------------------------------------------
        // Harmony is measured on the ANCHORS, because that is what the user
        // places. Lightness, chroma and contrast are measured on the FULL
        // palette, because that is what ships -- a bridge that fails on the
        // ground it lands on is just as broken as an anchor that does.
        function paletteMetrics(anchorHexes, fullHexes) {
            const lch = fullHexes.map(hexToOklch);

            const lSteps = [];
            for (let i = 1; i < lch.length; i++) lSteps.push(Math.abs(lch[i].L - lch[i - 1].L));
            const lMean = lSteps.reduce((a, b) => a + b, 0) / lSteps.length;

            const chromas = lch.map(c => c.C);
            const headroom = lch.map(c => {
                const hull = maxChroma(c.L, c.H);
                return hull > 0 ? c.C / hull : 1;
            });

            const onWhite = fullHexes.map(h => contrast(h, '#FFFFFF'));
            const onBlack = fullHexes.map(h => contrast(h, '#000000'));

            return {
                harmony: classifyHarmony(anchorHexes),
                lightness: {
                    meanStep: lMean,
                    worstDeviation: Math.max(...lSteps.map(s => Math.abs(s - lMean))),
                    smallestStep: Math.min(...lSteps),
                    range: Math.max(...lch.map(c => c.L)) - Math.min(...lch.map(c => c.L))
                },
                chroma: {
                    mean: chromas.reduce((a, b) => a + b, 0) / chromas.length,
                    spread: Math.max(...chromas) - Math.min(...chromas),
                    meanHullUse: headroom.reduce((a, b) => a + b, 0) / headroom.length
                },
                contrast: {
                    minOnWhite: Math.min(...onWhite),
                    minOnBlack: Math.min(...onBlack),
                    bestGround: Math.min(...onWhite) >= Math.min(...onBlack) ? 'white' : 'black'
                }
            };
        }

        // Generate full palette (anchors + bridges)
        function generatePalette() {
            const palette = [];
            for (let i = 0; i < anchors.length; i++) {
                palette.push({ color: anchors[i], isAnchor: true, anchorIndex: i });
                if (i < anchors.length - 1) {
                    const bridge = midpointColor(anchors[i], anchors[i + 1]);
                    palette.push({ color: bridge, isAnchor: false });
                }
            }
            return palette;
        }
        
        // Paint one existing bar. Everything that depends on the color lives
        // here so that a bar can be updated without being replaced.
        function paintBar(bar, item) {
            const hex = item.color.replace('#', '');
            bar.style.backgroundColor = item.color;
            bar.dataset.hex = hex;

            const ink = inkOn(item.color);
            const hexEl = bar.querySelector('.hex-code');
            hexEl.textContent = hex;
            hexEl.style.color = ink;
            bar.querySelector('.bar-label').style.color = ink;

            if (item.isAnchor) {
                // Written only when it genuinely differs. Assigning to an input
                // whose picker is open moves that picker, and during a drag the
                // value is already what we would be setting.
                const input = bar.querySelector('input');
                if (input.value.toLowerCase() !== item.color.toLowerCase()) {
                    input.value = item.color;
                }
            } else {
                bar.setAttribute('aria-label', `Copy ${item.color}`);
            }
        }

        function buildBar(item) {
            const bar = document.createElement('div');
            bar.className = `color-bar ${item.isAnchor ? 'anchor' : 'bridge'}`;

            bar.innerHTML = `
                <span class="hex-code"></span>
                <span class="bar-label">${item.isAnchor ? 'Anchor' : 'Auto'}</span>
                ${item.isAnchor ? `<input type="color" class="color-input" data-anchor-index="${item.anchorIndex}">` : ''}
            `;

            if (item.isAnchor) {
                const input = bar.querySelector('input');
                input.addEventListener('input', (e) => {
                    anchors[item.anchorIndex] = e.target.value.toUpperCase();
                    render();
                });
                // Persist when the picker settles rather than on every frame of
                // a drag -- localStorage is synchronous and a scrub fires
                // `input` dozens of times a second.
                input.addEventListener('change', saveState);
            } else {
                // A bridge is a control -- it copies. It was a bare <div>
                // with a click handler, so it could not be reached by
                // keyboard or announced as anything, which meant half the
                // palette was unusable without a pointer.
                bar.tabIndex = 0;
                bar.setAttribute('role', 'button');
                const copy = () => {
                    const hex = '#' + bar.dataset.hex;
                    // writeText rejects on an insecure origin and when the
                    // document is not focused. Unhandled, that is a button
                    // that silently does nothing.
                    navigator.clipboard.writeText(hex)
                        .then(() => showToast(`Copied ${hex}`))
                        .catch(() => showToast(hex));
                };
                bar.addEventListener('click', copy);
                bar.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); copy(); }
                });
            }

            paintBar(bar, item);
            return bar;
        }

        // Render the palette.
        //
        // Bars are REUSED whenever the shape of the palette is unchanged, and
        // that is the fix rather than an optimisation: the native color picker
        // belongs to the <input type="color"> it was opened from, and dragging
        // its hue handle fires `input` on every frame. Rebuilding the list on
        // each of those events destroyed that input, so the picker closed the
        // instant you started to scrub. Typing into the numeric fields survived
        // only because they commit once, after you have finished.
        //
        // The shape is the anchor/bridge sequence, which changes only when an
        // anchor is added or removed -- never while a color is being edited.
        function render() {
            const palette = generatePalette();
            const container = document.getElementById('palette');
            const shape = palette.map(p => p.isAnchor ? 'a' : 'b').join('');

            if (container.dataset.shape === shape) {
                palette.forEach((item, i) => paintBar(container.children[i], item));
            } else {
                container.innerHTML = '';
                palette.forEach(item => container.appendChild(buildBar(item)));
                container.dataset.shape = shape;
            }

            // Update bottom bar
            const allHex = palette.map(p => '#' + p.color.replace('#', '')).join(', ');
            document.getElementById('all-codes').textContent = allHex;
            
            // Update count display
            const totalColors = palette.length;
            document.getElementById('color-count').textContent = `${totalColors} colors`;
            
            // Update button states (2 anchors = 3 total, 5 anchors = 9 total)
            document.getElementById('btn-remove').disabled = anchors.length <= 2;
            document.getElementById('btn-add').disabled = anchors.length >= 5;
        }
        
        // Show toast
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 1500);
        }
        
        // Save state to localStorage
        function saveState() {
            localStorage.setItem('radiance-anchors', JSON.stringify(anchors));
            localStorage.setItem('radiance-bridge-mode', bridgeMode);
        }

        // Load state from localStorage. Everything here is validated rather
        // than trusted: this is a PWA, so a stored value outlives any number of
        // releases, and one bad parse is a permanently blank app that even
        // reinstalling does not fix.
        function loadState() {
            try {
                const saved = JSON.parse(localStorage.getItem('radiance-anchors'));
                if (Array.isArray(saved)) {
                    const clean = saved.filter(c => typeof c === 'string' && hexToRgb(c));
                    if (clean.length >= 2) anchors = clean.slice(0, 5).map(c => c.toUpperCase());
                }
            } catch (e) { /* keep the generated default */ }

            const mode = localStorage.getItem('radiance-bridge-mode');
            if (mode === 'blend' || mode === 'wheel') bridgeMode = mode;
        }

        // The bridge setting. Both buttons stay visible and one is pressed,
        // rather than a single button that toggles -- with a toggle the label
        // is ambiguous about whether it names the current state or the action,
        // and here both states are legitimate positions rather than on and off.
        const BRIDGE_NOTES = {
            blend: 'The color halfway between two anchors. Anchors far apart in hue blend toward grey.',
            wheel: 'Halfway around the color wheel. Keeps the saturation of the anchors instead.'
        };

        function setBridgeMode(mode) {
            bridgeMode = mode;
            document.querySelectorAll('#bridge-seg button').forEach(b => {
                b.setAttribute('aria-pressed', String(b.dataset.mode === mode));
            });
            document.getElementById('bridge-note').textContent = BRIDGE_NOTES[mode];
            render();
            saveState();
        }

        document.getElementById('bridge-seg').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-mode]');
            if (btn) setBridgeMode(btn.dataset.mode);
        });
        
        // Add colors (+1 anchor = +2 total)
        // Both of these used to call generateEvenHues(), which REPLACES the
        // whole anchor array -- so pressing + or - threw away every color you
        // had picked and reset to saturated evenly-spaced hues. You could not
        // build a 4-anchor palette at all: getting there wiped the 3 you had.
        //
        // The first attempt at fixing that APPENDED a new anchor, continuing the
        // palette's hue rhythm past the last one. That is wrong for the case
        // that matters most: the default anchors sit at hues 0, 120 and 240, so
        // the step is 120 and the "next" hue is 360 -- which is 0, the first
        // anchor again. Going to 9 colors produced repeats instead of a
        // rainbow. A palette that already spans the circle has no next
        // position; continuing the rhythm can only wrap onto itself.
        //
        // So the new anchor is INSERTED rather than appended, into the widest
        // gap. That cannot repeat, because it lands strictly between two
        // different colors; it preserves the palette's span, because the
        // endpoints never move; and it is the least surprising thing on screen,
        // because the value inserted is the bridge that was already sitting
        // there -- press + and the bridge you were looking at simply becomes an
        // anchor you can edit. Nothing else shifts.

        // Perceptual distance, so "widest gap" means the gap that LOOKS widest.
        // Hue distance would call red->green and green->blue equal at 120
        // degrees each when the eye does not read them that way at all.
        function oklabDistance(hex1, hex2) {
            const c1 = hexToOklab(hex1);
            const c2 = hexToOklab(hex2);
            return Math.hypot(c1.L - c2.L, c1.a - c2.a, c1.b - c2.b);
        }

        function addColors() {
            if (anchors.length >= 5) return;
            let at = 0, widest = -1;
            for (let i = 0; i < anchors.length - 1; i++) {
                const d = oklabDistance(anchors[i], anchors[i + 1]);
                if (d > widest) { widest = d; at = i; }
            }
            const bridge = midpointColor(anchors[at], anchors[at + 1]);
            anchors = anchors.slice(0, at + 1).concat(bridge, anchors.slice(at + 1));
            render();
            saveState();
        }

        // Remove colors (-1 anchor = -2 total). The inverse of the above: drop
        // the interior anchor that is doing the least work -- the one closest to
        // being the midpoint of its own neighbours, since a bridge would land
        // almost exactly there anyway. Endpoints are never removed, so the
        // palette keeps its span instead of collapsing from one end.
        function removeColors() {
            if (anchors.length <= 2) return;
            let at = anchors.length - 1, least = Infinity;
            for (let i = 1; i < anchors.length - 1; i++) {
                const d = oklabDistance(anchors[i], midpointColor(anchors[i - 1], anchors[i + 1]));
                if (d < least) { least = d; at = i; }
            }
            anchors = anchors.filter((_, i) => i !== at);
            render();
            saveState();
        }
        
        // Event listeners
        document.getElementById('btn-add').addEventListener('click', addColors);
        document.getElementById('btn-remove').addEventListener('click', removeColors);
        
        // Preset palettes - large curated library
        // Keyed by anchor count: 2=3 total, 3=5 total, 4=7 total, 5=9 total
        const presets = {
            2: [
                { name: 'Fire & Ice', colors: ['#FF4500', '#00CED1'] },
                { name: 'Day & Night', colors: ['#FFD700', '#191970'] },
                { name: 'Forest', colors: ['#228B22', '#8B4513'] },
                { name: 'Ocean', colors: ['#006994', '#40E0D0'] },
                { name: 'Sunset', colors: ['#FF6B6B', '#4ECDC4'] },
                { name: 'Berry', colors: ['#8B008B', '#FF69B4'] },
                { name: 'Earth', colors: ['#DAA520', '#2F4F4F'] },
                { name: 'Neon', colors: ['#FF1493', '#00FF7F'] },
            ],
            3: [
                { name: 'Primary', colors: ['#FF0000', '#FFFF00', '#0000FF'] },
                { name: 'Secondary', colors: ['#FF8000', '#00FF00', '#8000FF'] },
                { name: 'Pastel', colors: ['#FFB6C1', '#98FB98', '#87CEEB'] },
                { name: 'Sunset', colors: ['#FF6B6B', '#FFE66D', '#4ECDC4'] },
                { name: 'Neon', colors: ['#FF1493', '#00FF7F', '#00BFFF'] },
                { name: 'Earthy', colors: ['#8B4513', '#228B22', '#4682B4'] },
                { name: 'Vintage', colors: ['#DC143C', '#DAA520', '#008080'] },
                { name: 'Candy', colors: ['#FF69B4', '#FFD700', '#00CED1'] },
                { name: 'Forest', colors: ['#006400', '#8B4513', '#F4A460'] },
                { name: 'Ocean', colors: ['#000080', '#20B2AA', '#F0E68C'] },
                { name: 'Berry', colors: ['#8B0000', '#FF1493', '#9400D3'] },
                { name: 'Tropical', colors: ['#FF4500', '#32CD32', '#1E90FF'] },
            ],
            4: [
                { name: 'Jewel', colors: ['#9B2335', '#F5DF4D', '#009473', '#0F4C81'] },
                { name: 'Retro', colors: ['#FF6F61', '#88B04B', '#6B5B95', '#F7CAC9'] },
                { name: 'Ocean', colors: ['#003B46', '#07575B', '#66A5AD', '#C4DFE6'] },
                { name: 'Autumn', colors: ['#8B0000', '#FF8C00', '#FFD700', '#006400'] },
                { name: 'Candy', colors: ['#FF6B6B', '#FEC89A', '#90EE90', '#DDA0DD'] },
                { name: 'Nordic', colors: ['#2E4057', '#048A81', '#54C6EB', '#F8F4E3'] },
                { name: 'Sunset', colors: ['#F9C80E', '#F86624', '#EA3546', '#662E9B'] },
                { name: 'Forest', colors: ['#1B4332', '#2D6A4F', '#52B788', '#D8F3DC'] },
                { name: 'Dusk', colors: ['#22223B', '#4A4E69', '#9A8C98', '#C9ADA7'] },
                { name: 'Tropical', colors: ['#F72585', '#7209B7', '#3A0CA3', '#4CC9F0'] },
            ],
            5: [
                { name: 'Rainbow', colors: ['#FF0000', '#FFFF00', '#00FF00', '#00FFFF', '#8000FF'] },
                { name: 'Warm', colors: ['#FF0000', '#FF4500', '#FF8C00', '#FFD700', '#FFFF00'] },
                { name: 'Cool', colors: ['#00CED1', '#20B2AA', '#3CB371', '#2E8B57', '#006400'] },
                { name: 'Berry', colors: ['#8B008B', '#9932CC', '#BA55D3', '#DA70D6', '#FF69B4'] },
                { name: 'Coastal', colors: ['#0077B6', '#00B4D8', '#90E0EF', '#CAF0F8', '#FFDDD2'] },
                { name: 'Vintage', colors: ['#D62828', '#F77F00', '#FCBF49', '#EAE2B7', '#003049'] },
                { name: 'Neon', colors: ['#FF00FF', '#FF1493', '#00FFFF', '#00FF00', '#FFFF00'] },
                { name: 'Earth', colors: ['#5C4033', '#8B4513', '#DAA520', '#6B8E23', '#2F4F4F'] },
                { name: 'Pastel', colors: ['#FFB3BA', '#FFDFBA', '#FFFFBA', '#BAFFC9', '#BAE1FF'] },
                { name: 'Moody', colors: ['#10002B', '#240046', '#3C096C', '#5A189A', '#7B2CBF'] },
                { name: 'Citrus', colors: ['#FF595E', '#FFCA3A', '#8AC926', '#1982C4', '#6A4C93'] },
                { name: 'Sunset', colors: ['#03071E', '#370617', '#9D0208', '#DC2F02', '#FFBA08'] },
            ]
        };
        
        // Build presets panel
        function buildPresetsPanel() {
            const list = document.getElementById('presets-list');
            list.innerHTML = '';
            
            const currentCount = anchors.length;
            const relevantPresets = presets[currentCount] || presets[3];
            
            // Add "Even Hues" default
            const evenGroup = document.createElement('div');
            evenGroup.className = 'preset-group';
            evenGroup.innerHTML = `<div class="preset-group-title">Generated</div>`;
            
            const evenItem = document.createElement('div');
            evenItem.className = 'preset-item';
            const evenColors = generateEvenHues(currentCount);
            evenItem.innerHTML = `
                <div class="preset-swatches">
                    ${evenColors.map(c => `<div class="preset-swatch" style="background:${c}"></div>`).join('')}
                </div>
                <span class="preset-name">Even Hues</span>
            `;
            evenItem.addEventListener('click', () => {
                anchors = evenColors;
                render();
                saveState();
                closePresets();
            });
            evenGroup.appendChild(evenItem);
            list.appendChild(evenGroup);
            
            // Add curated presets
            if (relevantPresets) {
                const totalColors = currentCount * 2 - 1; // anchors + bridges
                const curatedGroup = document.createElement('div');
                curatedGroup.className = 'preset-group';
                curatedGroup.innerHTML = `<div class="preset-group-title">${totalColors}-Color Palettes</div>`;
                
                relevantPresets.forEach(preset => {
                    const item = document.createElement('div');
                    item.className = 'preset-item';
                    item.innerHTML = `
                        <div class="preset-swatches">
                            ${preset.colors.map(c => `<div class="preset-swatch" style="background:${c}"></div>`).join('')}
                        </div>
                        <span class="preset-name">${preset.name}</span>
                    `;
                    item.addEventListener('click', () => {
                        anchors = [...preset.colors];
                        render();
                        saveState();
                        closePresets();
                    });
                    curatedGroup.appendChild(item);
                });
                list.appendChild(curatedGroup);
            }
        }
        
        // Presets panel controls
        function openPresets() {
            buildPresetsPanel();
            document.getElementById('presets-panel').classList.add('open');
        }
        
        function closePresets() {
            document.getElementById('presets-panel').classList.remove('open');
        }
        
        document.getElementById('btn-presets').addEventListener('click', openPresets);
        document.getElementById('btn-close-presets').addEventListener('click', closePresets);
        
        // Init. setBridgeMode paints the segmented control and renders, so this
        // is one pass, not a render followed by a correcting render.
        loadState();
        setBridgeMode(bridgeMode);
    </script>
</body>
