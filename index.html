        // --- The OKLCH editor -----------------------------------------------
        // While the panel is open the LCH triple is the source of truth, not
        // the hex. Round-tripping through 8 bits on every frame makes the
        // handles jitter and quietly walks a colour away from where you put it.
        const AXES = {
            L: { min: 0, max: 1,   step: 0.005, fmt: v => v.toFixed(3) },
            C: { min: 0, max: 0.4, step: 0.002, fmt: v => v.toFixed(3) },
            H: { min: 0, max: 360, step: 1,     fmt: v => Math.round(v) + '°' }
        };

        let editing = null;
        let edit = { L: 0, C: 0, H: 0 };

        function currentHex() { return oklchToHex(edit); }

        function openPicker(index) {
            closePresets();
            editing = index;
            const c = hexToOklch(anchors[index]);
            edit = { L: c.L, C: c.C, H: c.H === null ? 0 : c.H };
            document.getElementById('picker-title').textContent = `Anchor ${index + 1}`;
            paintPicker();
            document.getElementById('picker-panel').classList.add('open');
        }

        function closePicker() {
            document.getElementById('picker-panel').classList.remove('open');
            editing = null;
            saveState();
        }

        function commitEdit() {
            if (editing === null) return;
            anchors[editing] = currentHex();
            render();
            paintPicker();
        }

        // Painted with this app's own conversion, so the track is a promise
        // about what the bar will show. The chroma track runs past the sRGB
        // ceiling on purpose: beyond it the colours simply stop getting more
        // saturated, which makes the gamut edge something you can see rather
        // than something that silently eats your input.
        function trackGradient(axis) {
            const a = AXES[axis];
            const n = axis === 'H' ? 24 : 16;
            const stops = [];
            for (let i = 0; i <= n; i++) {
                stops.push(oklchToHex({ ...edit, [axis]: a.min + (a.max - a.min) * (i / n) }));
            }
            return `linear-gradient(to right, ${stops.join(',')})`;
        }

        // --- The comb --------------------------------------------------------
        // A honeycomb of discrete cells: hue around, chroma outward, lightness
        // left to the slider beneath it. The lattice is the one Office's colour
        // dialog uses. The difference is that this one is laid out in OKLCH, so
        // a step looks like a step -- the same grid in HSL gives a dense band of
        // near-identical blues and a hole through the yellows.
        //
        // Each ring is a fraction of THAT HUE'S OWN ceiling rather than a fixed
        // chroma. A fixed chroma would clamp the outer rings wherever sRGB is
        // narrow and hand back rows of duplicates. The cost is that a ring is
        // equal relative saturation rather than equal chroma, which is the right
        // trade for a picker: every cell reachable, every cell different.
        //
        // This is a LAYOUT use of the gamut hull, not the bridge policy the
        // README rejects. There the algorithm would be inventing a colour; here
        // you are choosing one.
        const COMB_RINGS = 3, COMB_SIZE = 24;
        let combL = null;

        function combCells() {
            const cells = [];
            const maxDist = COMB_SIZE * Math.sqrt(3) * COMB_RINGS;
            for (let q = -COMB_RINGS; q <= COMB_RINGS; q++) {
                for (let r = -COMB_RINGS; r <= COMB_RINGS; r++) {
                    if (Math.abs(q + r) > COMB_RINGS) continue;
                    const x = COMB_SIZE * 1.5 * q;
                    const y = COMB_SIZE * Math.sqrt(3) * (r + q / 2);
                    const dist = Math.hypot(x, y);
                    cells.push({
                        x, y,
                        H: ((Math.atan2(y, x) * DEG) % 360 + 360) % 360,
                        frac: Math.min(1, dist / maxDist)
                    });
                }
            }
            return cells;
        }

        const COMB_SHAPE = [0, 1, 2, 3, 4, 5]
            .map(i => [COMB_SIZE * Math.cos(Math.PI / 3 * i), COMB_SIZE * Math.sin(Math.PI / 3 * i)]);

        function buildComb() {
            const svg = document.getElementById('comb');
            svg.innerHTML = combCells().map(c => {
                const C = c.frac * maxChroma(edit.L, c.H);
                const hex = oklchToHex({ L: edit.L, C, H: c.H });
                const pts = COMB_SHAPE.map(([px, py]) => `${(c.x + px).toFixed(1)},${(c.y + py).toFixed(1)}`).join(' ');
                return `<polygon points="${pts}" fill="${hex}" data-c="${C}" data-h="${c.H}"></polygon>`;
            }).join('');
            combL = edit.L;
        }

        // Selection is compared in the a/b plane rather than on C and H
        // separately: near the neutral axis a large hue difference is a tiny
        // colour difference, and comparing the angles would jump the ring.
        function markCombSelection() {
            const ea = edit.C * Math.cos(edit.H / DEG), eb = edit.C * Math.sin(edit.H / DEG);
            let best = null;
            for (const p of document.querySelectorAll('#comb polygon')) {
                const C = +p.dataset.c, H = +p.dataset.h;
                const d = Math.hypot(C * Math.cos(H / DEG) - ea, C * Math.sin(H / DEG) - eb);
                p.classList.remove('sel');
                if (!best || d < best.d) best = { p, d };
            }
            if (best) best.p.classList.add('sel');
        }

        document.getElementById('comb').addEventListener('click', (e) => {
            const cell = e.target.closest('polygon');
            if (!cell) return;
            edit.C = +cell.dataset.c;
            edit.H = +cell.dataset.h;
            commitEdit();
            saveState();
        });

        function paintPicker() {
            const hull = maxChroma(edit.L, edit.H);
            // The cells depend only on lightness, so they are rebuilt when it
            // moves rather than on every frame of any drag.
            if (combL === null || Math.abs(combL - edit.L) > 0.002) buildComb();
            markCombSelection();
            document.querySelectorAll('.ax').forEach(el => {
                const axis = el.dataset.axis, a = AXES[axis];
                const t = (edit[axis] - a.min) / (a.max - a.min);
                el.querySelector('.ax-val').textContent = a.fmt(edit[axis]);
                el.querySelector('.ax-rail').style.background = trackGradient(axis);
                el.querySelector('.ax-handle').style.left = `${t * 100}%`;
                el.querySelector('.ax-track').setAttribute('aria-valuenow', a.fmt(edit[axis]));
            });
            document.getElementById('picker-hex').value = currentHex();
            document.getElementById('picker-hint').textContent = edit.C > hull + 1e-4
                ? `Past the sRGB edge — chroma holds at ${hull.toFixed(3)} for this lightness and hue.`
                : `sRGB allows ${hull.toFixed(3)} chroma here.`;
        }

        function bindSlider(el) {
            const axis = el.dataset.axis, a = AXES[axis];
            const track = el.querySelector('.ax-track');
            const clamp = v => Math.min(a.max, Math.max(a.min, v));
            let lastX = 0;

            track.addEventListener('pointerdown', (e) => {
                track.setPointerCapture(e.pointerId);
                track.classList.add('grabbing');
                track.focus();
                const r = track.getBoundingClientRect();
                lastX = e.clientX;
                edit[axis] = clamp(a.min + ((e.clientX - r.left) / r.width) * (a.max - a.min));
                commitEdit();
            });

            track.addEventListener('pointermove', (e) => {
                if (!track.hasPointerCapture(e.pointerId)) return;
                const r = track.getBoundingClientRect();
                // Drag away from the track and the scrub slows down, for fine
                // adjustment. This is the iOS behaviour people feel and cannot
                // name, and it is the reason a short track can still be precise.
                const away = Math.max(0, Math.abs(e.clientY - (r.top + r.height / 2)) - r.height / 2);
                const ratio = Math.max(0.12, 1 / (1 + away / 55));
                const dx = e.clientX - lastX;
                lastX = e.clientX;
                edit[axis] = clamp(edit[axis] + (dx / r.width) * (a.max - a.min) * ratio);
                commitEdit();
            });

            const release = (e) => {
                track.classList.remove('grabbing');
                if (track.hasPointerCapture(e.pointerId)) track.releasePointerCapture(e.pointerId);
                saveState();
            };
            track.addEventListener('pointerup', release);
            track.addEventListener('pointercancel', release);

            track.addEventListener('keydown', (e) => {
                const step = a.step * (e.shiftKey ? 10 : 1);
                const d = (e.key === 'ArrowLeft' || e.key === 'ArrowDown') ? -step
                        : (e.key === 'ArrowRight' || e.key === 'ArrowUp') ? step : 0;
                if (!d) return;
                e.preventDefault();
                edit[axis] = clamp(edit[axis] + d);
                commitEdit();
                saveState();
            });
        }
        document.querySelectorAll('.ax').forEach(bindSlider);

        document.getElementById('picker-hex').addEventListener('change', (e) => {
            const v = '#' + e.target.value.trim().replace(/^#/, '').toUpperCase();
            if (!hexToRgb(v)) { paintPicker(); return; }
            const c = hexToOklch(v);
            // A neutral has no hue to read, so the one on the dial is kept.
            edit = { L: c.L, C: c.C, H: c.H === null ? edit.H : c.H };
            commitEdit();
            saveState();
        });

        // The native control stays reachable. It is a fine thing to type into,
        // and on iOS the system picker is genuinely good -- it is only a bad
        // place to scrub, which is what the sliders are for.
        const nativeInput = document.getElementById('native-input');
        document.getElementById('btn-native').addEventListener('click', () => {
            nativeInput.value = currentHex();
            nativeInput.click();
        });
        nativeInput.addEventListener('input', () => {
            const c = hexToOklch(nativeInput.value.toUpperCase());
            edit = { L: c.L, C: c.C, H: c.H === null ? edit.H : c.H };
            commitEdit();
        });
        nativeInput.addEventListener('change', saveState);
        document.getElementById('btn-close-picker').addEventListener('click', closePicker);

        // --- The sunflower ----------------------------------------------------
        // Rings are recursive midpoints of a CLOSED anchor ring, which is the
        // traditional colour wheel's structure done perceptually: n anchors
        // give n, n, 2n, 4n going out, so three anchors reach 24 florets --
        // the same count as the classic wheel, subdivided in OKLab and from
        // anchors you chose rather than in RYB from red, yellow and blue.
        //
        // Closing the ring invents a bridge the bar view never shows, from the
        // last anchor back to the first. Two anchors are degenerate here, since
        // both arcs between them give the same midpoint, so this wants three.
        const SUN_DEPTH = 4;

        function sunflowerRings(hexes, depth) {
            const rings = [hexes.slice()];
            let current = hexes.slice();
            for (let d = 1; d < depth; d++) {
                const mids = current.map((h, i) => midpointColor(h, current[(i + 1) % current.length]));
                rings.push(mids);
                const woven = [];
                current.forEach((h, i) => woven.push(h, mids[i]));
                current = woven;
            }
            return rings;
        }

        // A drop: three circles on one axis. A big bulb INWARD, a rounded tail
        // outward, and a flank arc tangent to both. The bulb sits inward and
        // the tail runs outward, so each ring's tails pass between the bulbs of
        // the ring outside it. That overlap is what makes it read as scales
        // rather than as concentric bands, and the angular gap is what keeps
        // the scales from fusing into a disc.
        //
        // The bulb was MEASURED off Gary's reference droplet rather than
        // chosen: on a 1024px image the drop ran y 100 -> 930 (length 830) and
        // was 520 wide at its widest, so the bulb is 0.313 of the length.
        //
        // The flanks then went two rounds. The reference's are straight -- its
        // 27.1 degree taper predicts a width of 102 a hundred pixels below the
        // tip and the image reads ~100 -- but Gary asked for them concave, with
        // a fatter rounded tail to match. The construction here does both, and
        // straight is not a separate case: it is DROP_BOW = null, the limit of
        // the same fillet as its radius goes to infinity.
        //
        // Why concave is safe now and was not before. An early attempt bowed
        // the sides toward the axis while the tip was a POINT; bowed far enough
        // the two sides meet there and the shape closes into a crescent, which
        // was the "claw" look. A tail of finite radius makes that impossible --
        // the flanks land on a circle, so they cannot converge.
        const DROP_BULB = 0.313;   // bulb radius as a fraction of drop length
        const DROP_NIB  = 0.30;    // tail radius as a fraction of the bulb
        const DROP_BOW  = 1.1;     // flank radius in drop lengths; null = straight
        const TAU = Math.PI * 2;

        // Centre of the flank circle, upper side. The flank touches bulb and
        // tail EXTERNALLY -- external tangency is what reverses the curvature,
        // so the flank bows toward the axis and still meets both smoothly.
        // Solving |F-Cb| = R+rb and |F-Cn| = R+rn for F: subtracting the two
        // eliminates the squares and leaves fu linear.
        function filletCentre(rc, cn, rb, rn, R) {
            const fu = ((rb - rn) * (2 * R + rb + rn) / (cn - rc) + rc + cn) / 2;
            const disc = (R + rb) * (R + rb) - (fu - rc) * (fu - rc);
            return disc > 0 ? [fu, Math.sqrt(disc)] : null;
        }

        // Below some R the flank cannot reach both circles at all and there is
        // no tidy closed form for where that is, so bisect. Asking for a bow
        // tighter than this must degrade to the tightest legal curve rather
        // than emit an arc SVG will quietly reinterpret.
        function minBowRadius(rc, cn, rb, rn) {
            let lo = 1e-6, hi = 1;
            while (!filletCentre(rc, cn, rb, rn, hi)) {
                hi *= 2;
                if (hi > 1e7) return null;
            }
            for (let i = 0; i < 60; i++) {
                const mid = (lo + hi) / 2;
                if (filletCentre(rc, cn, rb, rn, mid)) hi = mid; else lo = mid;
            }
            return hi;
        }

        // An SVG arc takes no centre -- two endpoints and a radius admit two,
        // either side of the chord, and the flags pick. So a sweep flag is a
        // property of the shape PLUS the direction you walk it, which is how
        // the bulb ended up bulging through its own flanks once. Derive both
        // flags from a point the arc must pass through and the question stops
        // being answerable by hand at all.
        function arcFlags(cx, cy, p0, p1, through) {
            const norm = t => ((t % TAU) + TAU) % TAU;
            const a0 = Math.atan2(p0[1] - cy, p0[0] - cx);
            const d1 = norm(Math.atan2(p1[1] - cy, p1[0] - cx) - a0);
            const dt = norm(Math.atan2(through[1] - cy, through[0] - cx) - a0);
            const sweep = dt <= d1 ? 1 : 0;
            const delta = sweep ? d1 : TAU - d1;
            return [delta > Math.PI ? 1 : 0, sweep];
        }

        function dropPath(a, innerEdge, tipR, halfSpan) {
            // The bulb has to be sized against the slot at ITS OWN centre, not
            // at the ring's inner edge -- the centre sits a full radius further
            // out, and measuring at the edge starved the inner rings. The
            // centre depends on the radius, so solve rather than guess:
            //   rb <= sin(h) * (innerEdge + rb)
            const s = Math.sin(halfSpan);
            const rb = Math.min(s * innerEdge / Math.max(0.05, 1 - s),
                                (tipR - innerEdge) * DROP_BULB);
            const rn = rb * DROP_NIB;
            const rc = innerEdge + rb;       // centre of the bulb
            const cn = tipR - rn;            // centre of the tail
            const at = (p) => `${(p[0] * Math.cos(a) - p[1] * Math.sin(a)).toFixed(2)},`
                            + `${(p[0] * Math.sin(a) + p[1] * Math.cos(a)).toFixed(2)}`;
            const arcTo = (c, p0, p1, r, through) => {
                const [la, sw] = arcFlags(c[0], c[1], p0, p1, through);
                return `A${r.toFixed(2)},${r.toFixed(2)} 0 ${la} ${sw} ${at(p1)} `;
            };

            let tb, tn, R = 0, F = null, thru = null;
            if (DROP_BOW !== null) {
                const rmin = minBowRadius(rc, cn, rb, rn);
                R = Math.max(DROP_BOW * (tipR - innerEdge), rmin === null ? 0 : rmin * 1.02);
                F = filletCentre(rc, cn, rb, rn, R);
            }
            if (F) {
                // Touch points lie on the centre lines, between the centres --
                // that is what external tangency means.
                const unit = (u) => {
                    const dx = F[0] - u, dy = F[1], h = Math.hypot(dx, dy);
                    return [dx / h, dy / h];
                };
                const ub = unit(rc), un = unit(cn);
                tb = [rc + rb * ub[0], rb * ub[1]];
                tn = [cn + rn * un[0], rn * un[1]];
                // The flank bulges AWAY from F, so the chord midpoint pushed
                // back out to the circle is a point it must pass through.
                const mid = [(tb[0] + tn[0]) / 2, (tb[1] + tn[1]) / 2];
                const h = Math.hypot(mid[0] - F[0], mid[1] - F[1]);
                thru = [F[0] + R * (mid[0] - F[0]) / h, F[1] + R * (mid[1] - F[1]) / h];
            } else {
                // Straight flank: the same touch points with cos g = (rb-rn)/D.
                const cg = Math.min(0.999, (rb - rn) / Math.max(1e-6, cn - rc));
                const sg = Math.sqrt(Math.max(0, 1 - cg * cg));
                tb = [rc + rb * cg, rb * sg];
                tn = [cn + rn * cg, rn * sg];
            }
            const tbl = [tb[0], -tb[1]], tnl = [tn[0], -tn[1]];

            return `M${at(tb)} `
                 + (F ? arcTo(F, tb, tn, R, thru) : `L${at(tn)} `)
                 + arcTo([cn, 0], tn, tnl, rn, [tipR, 0])
                 + (F ? arcTo([F[0], -F[1]], tnl, tbl, R, [thru[0], -thru[1]])
                      : `L${at(tbl)} `)
                 + arcTo([rc, 0], tbl, tb, rb, [innerEdge, 0])
                 + 'Z';
        }

        // Where each ring sits, and how big its florets are.
        //
        // Three things want incompatible radii and you can only have two:
        //
        //   equal florets  one bulb size on every ring
        //   equal gaps     gap = 1 - rb*n/(pi*rc), flat only when rc ~ n
        //   rings lapping  the radial step must not exceed a drop's LENGTH,
        //                  and rc ~ n doubles that step every ring
        //
        // The old layout took even radial bands and one floret size, which
        // fixes the first and third and abandons the second: rings 1-3 came
        // out byte-identical in size while their slot shrank from 94 to 61, so
        // ring 1 was two-thirds air and ring 3 was packed. Gary spotted it as
        // "the first 2 rings are correct then 3 and 4 are broken".
        //
        // The angles were never the problem -- every floret sits midway
        // between its two parents to within 0.000 degrees. Measure before
        // touching `offset` again.
        //
        // So: start from rc ~ n**SUN_POW and travel SUN_PULL of the way toward
        // the even-gap ideal, which buys most of the evening while the rings
        // still lap. Rings 0 and 1 always hold the SAME count (the sequence is
        // n, n, 2n, 4n), so even gaps would put them at the same radius -- the
        // tie is broken by nesting ring 0 inside, and it is the ring that
        // carries the leftover air. Gary chose the pull and the nudge off a
        // rendered sweep.
        const SUN_GAP  = 0.86;   // fraction of its slot a floret may occupy
        const SUN_FILL = 0.55;   // fraction of the tightest slot the bulb takes
        const SUN_POW  = 0.4;    // rc ~ n**SUN_POW before the pull
        const SUN_TIE  = 0.62;   // breaks the ring 0 / ring 1 count tie
        const SUN_NEST = 0.72;   // ring 0 as a fraction of ring 1's radius
        const SUN_PULL = 0.35;   // how far the middle rings travel toward even
        const SUN_R0   = 0.15;   // ring 0's extra nudge inward
        const SUN_RMAX = 152;    // the outermost tip, which is pinned

        function sunflowerLayout(counts) {
            const last = counts.length - 1;
            const base = counts.map(n => Math.pow(n, SUN_POW));
            base[0] *= SUN_TIE;
            // Size the floret from the TIGHTEST ring so none can overflow its
            // own slot -- that is what makes one shared size safe.
            let tight = Infinity;
            counts.forEach((n, k) => { tight = Math.min(tight, base[k] / n); });
            const A = SUN_FILL * TAU * tight / 2;
            const c = SUN_RMAX / (base[last] + A * (1 / DROP_BULB - 1));
            const rb = A * c, ln = rb / DROP_BULB;
            const rc = base.map(b => b * c);
            // The outer ring is pinned, so its slot is what sets the target
            // gap every other ring is trying to match.
            const g = 1 - rb * counts[last] / (Math.PI * rc[last]);
            const out = rc.slice();
            for (let k = 1; k < last; k++) {
                const even = rb * counts[k] / (Math.PI * (1 - g));
                out[k] = rc[k] + SUN_PULL * (even - rc[k]);
            }
            if (last >= 1) out[0] = Math.min(rc[0], out[1] * SUN_NEST) * (1 - SUN_R0);
            return out.map(r => ({ inner: r - rb, tip: r - rb + ln }));
        }

        function renderSunflower() {
            const svg = document.getElementById('sunflower');
            if (anchors.length < 3) {
                svg.innerHTML = '<text x="0" y="0" fill="#888" font-size="13" '
                    + 'text-anchor="middle">A wheel needs three anchors.</text>';
                return;
            }
            const rings = sunflowerRings(anchors, SUN_DEPTH);
            const layout = sunflowerLayout(rings.map(r => r.length));
            let out = '';
            rings.forEach((ring, k) => {
                const innerEdge = layout[k].inner, tipR = layout[k].tip;
                const step = (Math.PI * 2) / ring.length;
                const halfSpan = step / 2 * SUN_GAP;   // the rest is the gap
                // Every ring past the first is offset by half its own step, so
                // a subdivision sits between the two florets it came from.
                const offset = k === 0 ? 0 : 0.5;
                ring.forEach((hex, i) => {
                    const a = -Math.PI / 2 + (i + offset) * step;
                    out += `<path d="${dropPath(a, innerEdge, tipR, halfSpan)}" `
                         + `fill="${hex}"></path>`;
                });
            });
            // Painted inner rings first so the outer scales lap over them.
            svg.innerHTML = out;
        }

        function paintStage() {
            const stage = document.getElementById('stage');
            stage.classList.toggle('on-white', ground === '#FFFFFF');
            stage.classList.toggle('on-black', ground !== '#FFFFFF');
        }

        function syncGroundButton() {
            // The ground is a property of whatever is being LOOKED at: the
            // stage always has one, the book is printed on one, and the
            // columns only acquire one when the measured view starts
            // reporting against it.
            document.getElementById('btn-ground').hidden =
                !(page === 'show' || page === 'read' || measuring);
        }

        // ---- Read -------------------------------------------------------
        // Content lives in read.json, not in this file. Twelve colours hand
        // written into the markup is how a 2,000 line file becomes 6,000, and
        // it would make correcting a historical claim a code edit.
        let bookEntries = null;

        function paintBook() {
            const book = document.getElementById('book');
            book.classList.toggle('on-white', ground === '#FFFFFF');
            book.classList.toggle('on-black', ground !== '#FFFFFF');
        }

        function openBook() {
            if (bookEntries) return;
            fetch('read.json', { cache: 'no-cache' })
                .then(r => {
                    if (!r.ok) throw new Error('read.json ' + r.status);
                    return r.json();
                })
                .then(data => { bookEntries = data.entries; renderBook(); })
                .catch(err => {
                    // Loud on purpose. A silent catch here makes a JSON typo,
                    // a renamed file and an empty cached body produce the one
                    // identical blank page -- the mistake index.html in the
                    // other project shipped and had to be undone.
                    console.warn('Read: could not load read.json --', err.message);
                    document.getElementById('book').innerHTML =
                        '<div class="measure"><p class="prose">The book could not be '
                        + 'loaded. Check the console.</p></div>';
                });
        }

        function esc(s) {
            return String(s).replace(/[&<>"]/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
        }

        // read.json is plain text with one piece of markup: *asterisks* for
        // italics -- foreign words (*wadj*) and titles (*Opticks*). Escaped
        // first, so nothing else in the file can become HTML.
        function prose(s) {
            return esc(s).replace(/\*([^*]+)\*/g, '<em>$1</em>');
        }

        function renderBook() {
            const book = document.getElementById('book');

            const chips = bookEntries.map((e, i) =>
                `<button type="button" class="chip" data-jump="${esc(e.id)}" `
              + `style="background:${esc(e.swatch)}" aria-label="${esc(e.name)}" `
              + `aria-current="${i === 0}"></button>`).join('');

            const spreadsHtml = bookEntries.map(e => {
                // No plate yet, so the swatch stands in. A flat field would
                // read as a mistake; a raked gradient reads as a placeholder
                // and still shows what the type has to survive.
                const bg = e.plate
                    ? `background-image:url(${esc(e.plate)})`
                    : `background-image:linear-gradient(135deg,${esc(e.swatch)},`
                      + `color-mix(in oklab, ${esc(e.swatch)} 55%, #000))`;

                // A paragraph counts as checked only if it lists a source and
                // has nothing `pending`, so an entry marked 'verified' with a
                // gap in it still says so. Its sources still print either way.
                const hasSources = p => Array.isArray(p.sources) && p.sources.length > 0;
                const sourced = p => hasSources(p) && !p.pending;
                const gaps = e.body.filter(p => !sourced(p)).length;
                const warn = e.status !== 'verified'
                    ? '<p class="unverified">Unverified — this text has not been '
                      + 'checked against a source.</p>'
                    : gaps
                    ? `<p class="unverified">${gaps === 1 ? 'One paragraph' : gaps + ' paragraphs'}`
                      + ' here, marked with a dotted rule, ' + (gaps === 1 ? 'has' : 'have')
                      + ' not been checked against a source yet.</p>'
                    : '';

                const body = e.body.map(p =>
                    `<p${sourced(p) ? '' : ' class="unsourced"'}>${prose(p.text)}</p>`).join('');

                // Printed under the entry, each source once, in the order the
                // text first leans on it. Only http(s) links become links.
                const seen = new Set();
                const list = e.body.flatMap(p => hasSources(p) ? p.sources : [])
                    .filter(s => !seen.has(s.label) && seen.add(s.label))
                    .map(s => /^https?:\/\//.test(s.url || '')
                        ? `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a></li>`
                        : `<li>${esc(s.label)}</li>`).join('');
                const sources = list ? `<div class="sources"><h3>Sources</h3><ol>${list}</ol></div>` : '';

                const inserts = e.inserts.length
                    ? `<div class="inserts">${e.inserts.map(src =>
                        `<div class="insert" style="background-image:url(${esc(src)})"></div>`
                      ).join('')}</div>`
                    : '';

                return `<article class="spread" id="entry-${esc(e.id)}">`
                     + `<div class="plate" style="${bg}"><div class="plate-text">`
                     + `<div class="plate-name">${esc(e.name)}</div>`
                     + `<div class="plate-hex">${esc(e.swatch)}</div></div></div>`
                     + `<div class="measure">${warn}`
                     + `<p class="standfirst">${esc(e.standfirst)}</p>`
                     + `<div class="prose">${body}</div>${inserts}${sources}</div></article>`;
            }).join('');

            book.innerHTML = `<div class="chips" id="chips">${chips}</div>${spreadsHtml}`;

            book.querySelector('#chips').addEventListener('click', ev => {
                const b = ev.target.closest('[data-jump]');
                if (b) document.getElementById('entry-' + b.dataset.jump)
                    .scrollIntoView({ block: 'start' });
            });

            // Which entry is in view drives the chip, off a scroll handler
            // rather than an IntersectionObserver. IO is the better-shaped
            // tool and was written first -- but it does not fire AT ALL in
            // the preview pane used to check this work (zero callbacks, not
            // even the initial one), so it cannot be verified here, and an
            // unverifiable mechanism is worse than a plain one that can be
            // measured. At six elements the cost difference is noise.
            const spreads = [...book.querySelectorAll('.spread')];
            const chipEls = [...book.querySelectorAll('.chip')];
            let ticking = false;

            // The reading line is 80px down the VIEWPORT, just under the
            // sticky chips -- a constant, not an offset from the book. Both
            // are the same above 900px where the book's own top is 0, and
            // only the constant is right below it, where the book is taller
            // than the viewport and its top slides away as you scroll.
            function syncChip() {
                ticking = false;
                let current = spreads[0];
                for (const s of spreads) {
                    if (s.getBoundingClientRect().top <= 80) current = s;
                }
                const id = current.id.replace('entry-', '');
                chipEls.forEach(c =>
                    c.setAttribute('aria-current', String(c.dataset.jump === id)));
            }

            function onScroll() {
                if (ticking) return;
                ticking = true;
                requestAnimationFrame(syncChip);
            }

            // WHICH element scrolls changes with the breakpoint: above 900px
            // the body is height:100% overflow:hidden and the book is its own
            // scroller; below it the document scrolls and the book just grows,
            // so a listener on the book alone never fires on a phone.
            book.addEventListener('scroll', onScroll);
            window.addEventListener('scroll', onScroll, { passive: true });
            syncChip();
        }

        // Make and Show are pages, so Measure -- a lens over the columns --
        // is only offered on Make. That is what closes the false state the
        // two independent toggles allowed: Measure lit, body.measuring set,
        // and .palette (its only subject) display:none behind the stage.
        // `measuring` is remembered rather than cleared, so the lens is still
        // on when you come back to it.
        function setPage(name) {
            page = ['make', 'show', 'read'].indexOf(name) >= 0 ? name : 'make';
            document.body.classList.toggle('showing', page === 'show');
            document.body.classList.toggle('reading', page === 'read');
            document.querySelectorAll('#page-seg button').forEach(b =>
                b.setAttribute('aria-pressed', String(b.dataset.page === page)));
            const m = document.getElementById('btn-measure');
            m.hidden = page !== 'make';
            m.setAttribute('aria-pressed', String(measuring));
            document.body.classList.toggle('measuring', page === 'make' && measuring);
            // The palette-size stepper belongs to the palette. On Read it is
            // pointing at nothing on screen, and a control that does something
            // invisible is worse than one that is absent.
            document.querySelector('.count-group').hidden = page === 'read';
            syncGroundButton();
            paintStage();
            paintBook();
            if (page === 'show') renderSunflower();
            else if (page === 'read') openBook();
            else render();
        }

        document.getElementById('page-seg').addEventListener('click', e => {
            const b = e.target.closest('button[data-page]');
            if (b) setPage(b.dataset.page);
        });

        // The ground is a real choice rather than a preference: a colour that
        // carries text on white can be invisible on black, and this app's own
        // chrome is black while most things people build are not.
        function setMeasuring(on) {
            measuring = on;
            document.body.classList.toggle('measuring', on);
            document.getElementById('btn-measure').setAttribute('aria-pressed', String(on));
            syncGroundButton();
            render();
        }

        document.getElementById('btn-measure').addEventListener('click', () => setMeasuring(!measuring));

        function setGround(g) {
            ground = g;
            document.getElementById('btn-ground').textContent =
                ground === '#FFFFFF' ? 'on white' : 'on black';
            paintStage();
            paintBook();
            render();
        }

        // The ground starts on the system's light/dark setting and follows it
        // when it changes (a sunset switch, say) -- until the button is
        // pressed. After that the person's own choice wins for the visit.
        const darkQuery = matchMedia('(prefers-color-scheme: dark)');
        let groundChosen = false;
        const systemGround = () => darkQuery.matches ? '#000000' : '#FFFFFF';
        darkQuery.addEventListener('change', () => { if (!groundChosen) setGround(systemGround()); });

        document.getElementById('btn-ground').addEventListener('click', () => {
            groundChosen = true;
            setGround(ground === '#FFFFFF' ? '#000000' : '#FFFFFF');
        });

        document.getElementById('btn-presets').addEventListener('click', openPresets);
        document.getElementById('btn-close-presets').addEventListener('click', closePresets);
        
        // Init. setBridgeMode paints the segmented control and renders, so this
        // is one pass, not a render followed by a correcting render.
        loadState();
        if (systemGround() !== ground) setGround(systemGround());
        setBridgeMode(bridgeMode);
    </script>
</body>
</html>
